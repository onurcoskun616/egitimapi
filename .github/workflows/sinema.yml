name: sinema
on:
  workflow_dispatch:
    inputs:
      task_id:
        description: Sinematik film kurgu görevi (gen_tasks)
        required: true
      api_base:
        description: Uygulama adresi
        required: true
      token:
        description: Tek kullanımlık görev jetonu
        required: true
jobs:
  kurgu:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Jetonu gizle
        env:
          TASK_TOKEN: ${{ inputs.token }}
        run: echo "::add-mask::$TASK_TOKEN"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: ffmpeg ve yazı tipleri
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core fonts-dejavu-extra fonts-liberation > /dev/null
      - name: Kurgu
        env:
          TASK_ID: ${{ inputs.task_id }}
          API_BASE: ${{ inputs.api_base }}
          TASK_TOKEN: ${{ inputs.token }}
        run: node render/sinema.mjs
