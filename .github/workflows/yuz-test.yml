name: yuz-test
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -q -r render/shorts/requirements.txt
      - name: test
        working-directory: render/shorts
        run: |
          curl -sSL -o /tmp/p.jpg https://storage.googleapis.com/mediapipe-assets/portrait.jpg || true
          python3 -c "
          import time; t=time.time()
          from PIL import Image
          import puppet
          im=Image.open('/tmp/p.jpg').convert('RGB'); print(im.size)
          f,e=puppet.detect_face(im); print('SONUC1', f, e, round(time.time()-t,1))
          import mediapipe; print(mediapipe.__version__)
          "
      - name: apt
        run: timeout 120 sudo apt-get install -y --no-install-recommends libgles2 libegl1 2>&1 | tail -2; ls /usr/lib/x86_64-linux-gnu/ | grep -i gles
      - name: test2
        working-directory: render/shorts
        run: |
          python3 -c "
          from PIL import Image
          import puppet
          im=Image.open('/tmp/p.jpg').convert('RGB')
          f,e=puppet.detect_face(im); print('SONUC2', f, e)
          "
