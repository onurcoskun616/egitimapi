name: generate
on:
  workflow_dispatch:
    inputs:
      task_id:
        description: Claude görev kimliği
        required: true
      api_base:
        description: Uygulama adresi
        required: true
      token:
        description: Tek kullanımlık görev jetonu
        required: true
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Jetonu gizle
        env:
          TASK_TOKEN: ${{ inputs.token }}
        run: echo "::add-mask::$TASK_TOKEN"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: İçerik ve sahne kodunu üret
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          TASK_ID: ${{ inputs.task_id }}
          API_BASE: ${{ inputs.api_base }}
          TASK_TOKEN: ${{ inputs.token }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            curl -s -X POST -H 'Content-Type: application/json' -d '{"error":"CLAUDE_CODE_OAUTH_TOKEN GitHub sırlarına eklenmemiş"}' "$API_BASE/api/task/$TASK_ID/result?token=$TASK_TOKEN"
            exit 1
          fi
          node render/generate.mjs
